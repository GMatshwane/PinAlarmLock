name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the runner}"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1e45" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646161b162d1c6c7abc3a5" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Lint, test, and assemble
        run: ./gradlew --no-daemon :app:ktlintCheck :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

  play-bundle:
    name: play-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on the runner}"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1e45" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646161b162d1c6c7abc3a5" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Create CI-only signing key
        run: |
          set -euo pipefail
          mkdir -p ci-keystore
          keytool -genkeypair \
            -keystore ci-keystore/ci.jks \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -storepass android \
            -keypass android \
            -dname "CN=PinAlarmLock CI, OU=CI, O=PinAlarmLock, L=Local, ST=NA, C=US"
          printf '%s\n' \
            'storeFile=ci-keystore/ci.jks' \
            'storePassword=android' \
            'keyAlias=ci' \
            'keyPassword=android' > keystore.properties

      - name: Bundle release AAB
        env:
          ALLOW_CI_SIGNING: "true"
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload CI-signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ci
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
